[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ax-task-runner-py"
version = "0.1.0"
description = "Minimal-dependency Python implementation of the google/ax task runner contract for custom AX Task images"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Google SecOps Team", email = "chronicle@google.com" }
]
keywords = ["google", "ax", "agent-substrate", "sandbox"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
# Deliberately tiny: this package is installed INSIDE the untrusted sandbox image.
dependencies = [
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
ax-task-runner = "ax_task_runner.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ax_task_runner*"]
