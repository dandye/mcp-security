# Agent Substrate (ate.dev, commit 57fab750) WorkerPool CRD referencing the
# cluster-installed gvisor-default SandboxConfig (sandboxconfig-gvisor.yaml)
# for running untrusted AX security investigation tasks in gVisor.
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: secops-ax-gvisor-pool
  namespace: ate-workloads
spec:
  replicas: 4
  workerImage: "${ATEWORKER_GVISOR_IMAGE}"
  template:
    labels:
      workload: secops-ax-gvisor
    resources:
      limits:
        cpu: "4000m"
        memory: "8Gi"
  sandboxClasses:
    - name: gvisor
      configRef:
        name: gvisor-default
