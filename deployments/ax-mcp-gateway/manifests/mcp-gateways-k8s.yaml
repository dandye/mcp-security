# Out-of-sandbox Kubernetes Namespace, GKE Workload Identity ServiceAccounts,
# default-deny NetworkPolicy, and Streamable HTTP / Vertex AI Gateway Deployments
# + Services for all four google/mcp-security servers (secops, gti, secops-soar,
# scc) plus the actorJwt-protected Vertex AI Gemini proxy (llm-gateway).
apiVersion: v1
kind: Namespace
metadata:
  name: secops-gateways
  labels:
    app.kubernetes.io/part-of: mcp-security-ax-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secops-mcp-sa
  namespace: secops-gateways
  annotations:
    iam.gke.io/gcp-service-account: "secops-mcp-gw@${PROJECT_ID}.iam.gserviceaccount.com"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scc-mcp-sa
  namespace: secops-gateways
  annotations:
    iam.gke.io/gcp-service-account: "scc-mcp-gw@${PROJECT_ID}.iam.gserviceaccount.com"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway-sa
  namespace: secops-gateways
  annotations:
    iam.gke.io/gcp-service-account: "llm-gateway-gw@${PROJECT_ID}.iam.gserviceaccount.com"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gti-mcp-sa
  namespace: secops-gateways
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secops-soar-mcp-sa
  namespace: secops-gateways
---
# Default-deny ingress in secops-gateways; only Agent Substrate atenet-egress pods
# in ate-system may connect to port 8080 on the MCP and LLM gateway pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-atenet-egress
  namespace: secops-gateways
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: atenet-egress
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secops-mcp
  namespace: secops-gateways
  labels:
    app.kubernetes.io/name: secops-mcp
    app.kubernetes.io/component: mcp-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secops-mcp
      app.kubernetes.io/component: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secops-mcp
        app.kubernetes.io/component: mcp-gateway
    spec:
      serviceAccountName: secops-mcp-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "us-docker.pkg.dev/${PROJECT_ID}/secops-mcp/secops-mcp-gateway@sha256:1111111111111111111111111111111111111111111111111111111111111111"
          args: ["--server", "secops", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http-mcp
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_SERVICE_NAME
              value: "secops-mcp"
            - name: GATEWAY_NAMESPACE
              value: "secops-gateways"
            - name: GATEWAY_REQUIRE_ACTOR_JWT
              value: "true"
            - name: GATEWAY_EXPECTED_ISSUER
              value: "${ACTOR_JWT_ISSUER}"
            - name: GATEWAY_EXPECTED_AUDIENCE
              value: "http://secops-mcp.secops-gateways.svc.cluster.local:8080"
            - name: GATEWAY_JWKS_URL
              value: "${ACTOR_JWT_ISSUER}/openid/v1/jwks"
            - name: GATEWAY_JWKS_CA_FILE
              value: "/run/servicedns-ca/trust-bundle.pem"
            - name: GATEWAY_ALLOWED_ATESPACES
              value: "secops"
            - name: GATEWAY_ALLOWED_ACTORS
              value: "secops/secops-triage-agent"
            - name: CHRONICLE_PROJECT_ID
              value: "${CHRONICLE_PROJECT_ID}"
            - name: CHRONICLE_CUSTOMER_ID
              value: "${CHRONICLE_CUSTOMER_ID}"
            - name: CHRONICLE_REGION
              value: "${CHRONICLE_REGION}"
          volumeMounts:
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-mcp
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: secops-mcp
  namespace: secops-gateways
spec:
  selector:
    app.kubernetes.io/name: secops-mcp
    app.kubernetes.io/component: mcp-gateway
  ports:
    - name: http-mcp
      port: 8080
      targetPort: http-mcp
      protocol: TCP
---
