[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-agy-poc"
version = "0.1.0"
description = "Proof of Concept for Native Model Context Protocol (MCP) in Google Antigravity SDK with mcp-security tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Google LLC" }
]
dependencies = [
    "google-antigravity>=0.1.20",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
