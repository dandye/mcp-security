[project]
name = "scc-mcp"
version = "0.3.0"
description = "Security Command Center MCP server"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Google SecOps Team", email = "chronicle@google.com" }
]
keywords = ["google", "security", "chronicle", "scc", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
    "google-api-core>=2.19.0",
    "google-auth>=2.48.0",
    "google-cloud-asset>=3.15.0",
    "google-cloud-securitycenter>=1.38.0",
    "httpx>=0.28.1",
    "httpx2>=2.10.0",
    "mcp[cli]>=2.3.0,<3.0.0",
    "protobuf>=4.25.0",
    "pydantic>=2.11.2",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "starlette>=0.40.0",
    "typing-extensions>=4.8.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/google/mcp-security"
Documentation = "https://github.com/google/mcp-security/tree/main/server/scc#readme"
Repository = "https://github.com/google/mcp-security/tree/main/server/scc"
Issues = "https://github.com/google/mcp-security/issues"

[project.scripts]
scc_mcp = "scc_mcp:main"

[project.entry-points.mcp]
scc-mcp = "scc_mcp:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["scc_mcp"]
