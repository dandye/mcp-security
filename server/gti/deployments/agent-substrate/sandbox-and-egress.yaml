# Agent Substrate (ate.dev, commit cdac9bae) sandbox and zero-secret egress
# configuration for gti-mcp DSPy RLM file and behavior distillation.
# Render ${PROJECT_ID} via envsubst before applying (see README.md).
apiVersion: ate.dev/v1
kind: SandboxConfig
metadata:
  name: gvisor-gti-rlm
spec:
  # Uses ateworker-gvisor (runsc user-space Sentry kernel) so actors run on
  # standard GKE Linux nodes without requiring /dev/kvm nested virtualization.
  sandboxClass: gvisor
  workerImage: "ghcr.io/agent-substrate/ateworker-gvisor@sha256:8f4e2a1b9c3d5e7f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f"
  defaultRuntime: "runsc-20261001.0"
  runtimes:
    - version: "runsc-20261001.0"
      flags:
        - "--allow-connected-on-save"
        - "--cpu-num-from-quota"
        - "--net-raw=false"
      assets:
        - name: runsc
          url: "gs://gvisor/releases/release/20261001.0/x86_64/runsc"
          sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: gti-rlm-gvisor-pool
  namespace: ate-workloads
  labels:
    ate.dev/pool: gti-rlm-gvisor
spec:
  replicas: 4
  sandboxClasses:
    - name: gvisor
      configRef:
        name: gvisor-gti-rlm
---
apiVersion: ate.dev/v1
kind: ActorTemplate
metadata:
  name: gti-mcp-rlm
  atespace: secops
spec:
  workerSelector:
    ate.dev/pool: gti-rlm-gvisor
  snapshotConfig:
    preferredFidelity: MEMORY
  resources:
    limits:
      cpuMillicores: 1000
      memoryBytes: 1073741824
  volumes:
    - name: egress-ca-trust-bundle
      projectedTrustBundle:
        bundleName: atenet-egress-ca
  containers:
    - name: gti-mcp
      image: "us-docker.pkg.dev/${PROJECT_ID}/secops-mcp/gti-mcp@sha256:4b825dc642cb6eb9a060e54bf8d69288fbee4904e8a9c3d7b6f9a1c2d3e4f5a6"
      command:
        - "gti_mcp"
      env:
        - name: GTI_ZERO_SECRET_EGRESS
          value: "true"
        - name: SSL_CERT_FILE
          value: "/var/run/ate/egress-ca/ca-bundle.crt"
      volumeMounts:
        - name: egress-ca-trust-bundle
          mountPath: "/var/run/ate/egress-ca"
          readOnly: true
---
apiVersion: ate.dev/v1
kind: EgressPolicy
metadata:
  name: default
  atespace: secops
  actor: gti-mcp-rlm
spec:
  # Fail-closed default deny: unmatched hosts, unresolvable secrets, and
  # non-TCP protocols are dropped by atenet-egress.
  defaultAction: DENY
  rules:
    - https:
        hostnames:
          - "www.virustotal.com"
        ports:
          - 443
        effects:
          replaceHeaders:
            - header: "x-apikey"
              credentialUri: "ate-secret://secretmanager.googleapis.com/projects/${PROJECT_ID}/secrets/vt-apikey/versions/latest"
    - https:
        hostnames:
          - "generativelanguage.googleapis.com"
        ports:
          - 443
        effects:
          replaceHeaders:
            - header: "x-goog-api-key"
              credentialUri: "ate-secret://secretmanager.googleapis.com/projects/${PROJECT_ID}/secrets/gemini-api-key/versions/latest"
