# Agent Substrate (ate.dev, commit 57fab750) Kubernetes infrastructure CRDs
# (SandboxConfig and WorkerPool) for gti-mcp DSPy RLM distillation.
# Note: ActorTemplate (actor-template.yaml) and EgressPolicy (egress-policy.yaml)
# are ate-api-server gRPC protojson resources applied via kubectl-ate, not K8s CRDs.
apiVersion: ate.dev/v1
kind: SandboxConfig
metadata:
  name: gvisor-gti-rlm
spec:
  # Uses ateworker-gvisor (runsc user-space Sentry kernel) so actors run on
  # standard GKE Linux nodes without requiring /dev/kvm nested virtualization.
  sandboxClass: gvisor
  defaultVersion: "runsc-20261026"
  versions:
    - name: "runsc-20261026"
      state: Enabled
      assets:
        amd64:
          gvisor:
            url: "gs://gvisor/releases/release/20261026.0/x86_64/gvisor.tar.zstd"
            sha256: "708afc62f2ee82d19930c703e85f9dab4f27a78c0aec40c0f55eb1040107f1a7"
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: gti-rlm-gvisor-pool
  namespace: ate-workloads
  labels:
    workload: gti-rlm-gvisor
spec:
  replicas: 4
  workerImage: "ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0-rc.1@sha256:02a31963cdfb1d250d205a55fb870385b1ba5bad1be1308d556a6296f76bf145"
  template:
    labels:
      workload: gti-rlm-gvisor
  sandboxClasses:
    - name: gvisor
      configRef:
        name: gvisor-gti-rlm
