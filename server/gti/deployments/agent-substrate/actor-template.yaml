# Single-document ateapi.v1.ActorTemplate protojson manifest for kubectl-ate:
#   envsubst '${PROJECT_ID}' < actor-template.yaml | kubectl ate create actor-template -f -
metadata:
  atespace: secops
  name: gti-mcp-rlm
workerSelector:
  matchLabels:
    workload: gti-rlm-gvisor
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  goldenSnapshotConfig:
    mode: GOLDEN_SNAPSHOT_MODE_DISABLED
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 1073741824
volumes:
  - name: egress-ca-trust-bundle
    systemInfo:
      dataSources:
        - trustBundle:
            names:
              - "egress-mitm.ate.dev"
              - "system-roots.ate.dev"
            path: "ca-bundle.crt"
containers:
  - name: gti-mcp
    image: "us-docker.pkg.dev/${PROJECT_ID}/secops-mcp/gti-mcp@sha256:4b825dc642cb6eb9a060e54bf8d69288fbee4904e8a9c3d7b6f9a1c2d3e4f5a6"
    command:
      - "gti_mcp"
    env:
      - name: GTI_ZERO_SECRET_EGRESS
        value: "true"
      - name: GTI_MCP_TRANSPORT
        value: "streamable-http"
      - name: GTI_MCP_HOST
        value: "0.0.0.0"
      - name: GTI_MCP_PORT
        value: "8080"
      - name: STATELESS
        value: "1"
      - name: GTI_RLM_MODEL
        value: "gemini/gemini-3.8-flash"
      - name: GTI_RLM_SUB_MODEL
        value: "gemini/gemini-3.5-flash-lite"
      - name: SSL_CERT_FILE
        value: "/run/ate/egress-ca/ca-bundle.crt"
      - name: REQUESTS_CA_BUNDLE
        value: "/run/ate/egress-ca/ca-bundle.crt"
    wakeupProbe:
      httpGet:
        path: "/readyz"
        port: 8080
    volumeMounts:
      - name: egress-ca-trust-bundle
        mountPath: "/run/ate/egress-ca"
