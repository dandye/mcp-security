# Single-document ateapi.v1.EgressPolicy protojson manifest for kubectl-ate:
#   envsubst '${PROJECT_ID}' < egress-policy.yaml | kubectl ate create egress-policy gti-mcp-rlm --atespace secops -f -
# Fail-closed default deny: unmatched hosts, unresolvable secrets, and non-TCP
# protocols are dropped by atenet-egress; deleting an actor's policy denies all egress.
metadata:
  atespace: secops
  name: default
rules:
  - https:
      hostnames:
        - "www.virustotal.com"
      ports:
        numbers:
          - 443
      effects:
        replaceHeaders:
          - header: "x-apikey"
            credentialUri: "ate-secret://secretmanager.googleapis.com/projects/${PROJECT_ID}/secrets/vt-apikey/versions/latest"
  - https:
      hostnames:
        - "generativelanguage.googleapis.com"
      ports:
        numbers:
          - 443
      effects:
        replaceHeaders:
          - header: "x-goog-api-key"
            credentialUri: "ate-secret://secretmanager.googleapis.com/projects/${PROJECT_ID}/secrets/gemini-api-key/versions/latest"
