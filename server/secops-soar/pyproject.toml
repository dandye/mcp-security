[project]
name = "secops-soar-mcp"
version = "0.3.0"
description = "Google SecOps SOAR MCP server"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Google SecOps Team", email = "chronicle@google.com" }
]
keywords = ["google", "security", "chronicle", "secops", "soar", "gti", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.11.15",
    "cryptography>=42.0.0",
    "httpx>=0.28.1",
    "httpx2>=2.10.0",
    "mcp[cli]>=2.3.0,<3.0.0",
    "pydantic>=2.11.2",
    "python-dotenv>=1.1.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/google/mcp-security"
Documentation = "https://github.com/google/mcp-security/tree/main/server/secops-soar#readme"
Repository = "https://github.com/google/mcp-security/tree/main/server/secops-soar"
Issues = "https://github.com/google/mcp-security/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
secops_soar_mcp = "secops_soar_mcp.server:run_main"
secops-soar-mcp = "secops_soar_mcp.server:run_main"

[project.entry-points.mcp]
secops-soar = "secops_soar_mcp.server:run_main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["secops_soar_mcp*", "logger_utils*"]

[tool.pytest.ini_options]
markers = [
    "integration: live SOAR integration tests requiring config.json credentials",
]
